name: CI & Deploy to Amvera

on:
  push:
    branches:
      - devDK
  pull_request:
    branches:
      - devDK

jobs:
  # ── Quality gate ──────────────────────────────────────────────────────────
  # Backend tests + frontend type-check/build. Runs on every push and PR.
  # Deploy depends on this job, so broken code never reaches production.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend — install & test
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Frontend — install & build (tsc + vite)
        working-directory: web
        run: |
          npm ci
          npm run build

  # ── Deploy ────────────────────────────────────────────────────────────────
  # Only on push to devDK, and only after `test` passes.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/devDK'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Amvera
        env:
          AMVERA_PASSWORD: ${{ secrets.AMVERA_PASSWORD }}
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          # 2026-10-14: проект переехал с кластера msk0 (лёг вместе со своим
          # git-сервером, деплой падал «Couldn't connect») на варшавский waw0.
          # Пароль — учётки Amvera, не проекта, поэтому секрет тот же.
          git remote add amvera https://keshetash:${AMVERA_PASSWORD}@git.waw0.amvera.ru/keshetash/blizkie-warsaw
          git push amvera devDK:master --force
